<script>
  (function() {
    // Flash Toggle Simulation
    const flashBtn = document.getElementById('flashToggle');
    const flashIcon = document.getElementById('flashIcon');
    let isFlashOn = false;

    if (flashBtn && flashIcon) {
      flashBtn.addEventListener('click', () => {
        isFlashOn = !isFlashOn;
        flashIcon.textContent = isFlashOn ? 'flash_on' : 'flash_off';
        flashBtn.classList.toggle('text-secondary-fixed', isFlashOn);
      });
    }

    // Interactive Document Category Selector Tabs
    const tabs = document.querySelectorAll('.doc-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.classList.remove('bg-secondary-container', 'text-on-secondary-container');
          t.classList.add('text-surface-container-high');
        });
        tab.classList.add('bg-secondary-container', 'text-on-secondary-container');
        tab.classList.remove('text-surface-container-high');
      });
    });

    // Vertical Laser Scanning Animation Cycle
    const laser = document.getElementById('laserLine');
    let direction = 1;
    let position = 30;

    function animateScanner() {
      if (!laser) return;
      position += direction * 2;
      if (position >= 280) direction = -1;
      if (position <= 30) direction = 1;
      laser.style.transform = `translateY(${position}px)`;
      requestAnimationFrame(animateScanner);
    }
    requestAnimationFrame(animateScanner);

    // Shutter Trigger Haptic Micro-Interaction
    const shutter = document.getElementById('shutterBtn');
    if (shutter) {
      shutter.addEventListener('click', () => {
        shutter.style.transform = 'scale(0.88)';
        setTimeout(() => {
          shutter.style.transform = 'scale(1)';
        }, 150);
      });
    }
  })();
